<div class="p-1 space-y-6">

  <!-- PLANTILLAS PARA CELDAS PERSONALIZADAS -->

  <!-- Celda de Acciones (Editar / Eliminar alineados a la izquierda) -->
  <ng-template #actionsCell let-product>
    <div class="flex items-center space-x-2">
      <button 
        (click)="onEditProduct(product)" 
        class="p-1.5 text-slate-400 hover:text-blue-400 transition cursor-pointer" 
        title="Editar">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002-2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      </button>
      <button 
        (click)="onDeleteProduct(product)" 
        class="p-1.5 text-slate-400 hover:text-red-400 transition cursor-pointer" 
        title="Eliminar">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </ng-template>

  <!-- Celda de Producto -->
  <ng-template #productCell let-product>
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center">
        <img 
          *ngIf="product.imageUrl" 
          [src]="product.imageUrl" 
          [alt]="product.name" 
          class="w-full h-full object-cover" />
      </div>
      <div>
        <span class="font-medium text-white block">{{ product.name }}</span>
        <span class="text-xs text-slate-500 line-clamp-1">{{ product.description || 'Sin descripción' }}</span>
      </div>
    </div>
  </ng-template>

  <!-- Celda de Categoría -->
  <ng-template #categoryCell let-product>
    <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-blue-950/60 text-blue-400 border border-blue-800/50 whitespace-nowrap">
      {{ product.category?.name || product.category || 'General' }}
    </span>
  </ng-template>

  <!-- Celda de Precio -->
  <ng-template #priceCell let-product>
    <span class="font-semibold text-white whitespace-nowrap">
      Gs. {{ product.price | number:'1.0-0' }}
    </span>
  </ng-template>

  <!-- TABLA GENÉRICA CON TÍTULO Y BOTÓN DE AGREGAR INTEGRADOS -->
  <app-generic-table
    procedure="GET_PRODUCTS"
    title="Gestión de Productos"
    [columns]="columns"
    [customTemplates]="customTemplates"
    (addClicked)="onCreateProduct()">
  </app-generic-table>

</div>
