<div *ngIf="isOpen()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 overflow-y-auto">
  <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col my-auto">
    
    <!-- Modal Header -->
    <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
      <h3 class="text-base font-semibold text-white">
        {{ productForm.get('id')?.value ? 'Editar Producto #' + productForm.get('id')?.value : 'Nuevo Producto' }}
      </h3>
      <button (click)="close()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="productForm" (ngSubmit)="submitForm()" class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
      
      <!-- Nombre -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Nombre del Producto *</label>
        <input 
          type="text" 
          formControlName="name"
          placeholder="Ej: Smart TV Samsung 50 pulgadas"
          class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition" />
        <span *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid" class="text-[11px] text-red-400 mt-1 block">
          El nombre es obligatorio.
        </span>
      </div>

      <!-- Sección, Categoría, Subcategoría -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Sección *</label>
          <select formControlName="section" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
            <option value="" disabled>Seleccionar...</option>
            <option *ngFor="let sec of sectionsList()" [value]="sec">{{ sec }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Categoría *</label>
          <select formControlName="category" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
            <option value="" disabled>Seleccionar...</option>
            <option *ngFor="let cat of categoriesList()" [value]="cat">{{ cat }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Subcategoría</label>
          <select formControlName="subcategory" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
            <option value="">Seleccionar...</option>
            <option *ngFor="let sub of subcategoriesList()" [value]="sub">{{ sub }}</option>
          </select>
        </div>
      </div>

      <!-- Marca y Modelo -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Marca</label>
          <select formControlName="brand" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
            <option value="">Seleccionar...</option>
            <option *ngFor="let brand of brandsList()" [value]="brand">{{ brand }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Modelo</label>
          <select formControlName="model" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
            <option value="">Seleccionar...</option>
            <option *ngFor="let model of modelsList()" [value]="model">{{ model }}</option>
          </select>
        </div>
      </div>

      <!-- Precio e Imagen -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Precio (Gs.) *</label>
          <input type="number" formControlName="price" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">URL Imagen</label>
          <input type="text" formControlName="imageUrl" placeholder="https://..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition" />
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Descripción</label>
        <textarea formControlName="description" rows="3" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
      </div>

      <!-- Footer -->
      <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-2">
        <button type="button" (click)="close()" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 rounded-lg transition cursor-pointer">
          Cancelar
        </button>
        <button type="submit" class="px-4 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition shadow cursor-pointer">
          Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
