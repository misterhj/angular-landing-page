<div class="p-6 max-w-4xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-white">Gestión de Secciones</h1>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <div class="flex gap-2">
            <input [(ngModel)]="newSectionName" placeholder="Ej: Destacados, Ofertas del Mes, Novedades..."
                class="flex-1 bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
            <button (click)="createSection()"
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 text-sm font-medium rounded-lg transition">
                Crear Sección
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <div *ngFor="let sec of sections()"
                class="flex items-center justify-between bg-slate-800/50 border border-slate-700/60 px-4 py-3 rounded-lg">
                <span class="text-sm font-medium text-slate-200">{{ sec.name }}</span>
                <button (click)="deleteSection(sec.id!)" class="text-rose-400 hover:text-rose-300 text-xs p-1">
                    ✕
                </button>
            </div>
        </div>
    </div>
</div>
