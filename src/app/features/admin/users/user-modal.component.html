<app-modal
  [isOpen]="isOpen"
  [title]="title"
  maxWidthClass="max-w-md"
  (close)="onCloseModal()">

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

    <!-- Nombre/s -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Nombre/s</label>
      <input 
        type="text" 
        formControlName="firstName"
        placeholder="Ej. Juan Carlos"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
      <span *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid" class="text-[10px] text-red-400 mt-1 block">
        El nombre es obligatorio (mínimo 2 caracteres).
      </span>
    </div>

    <!-- Apellido/s -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Apellido/s</label>
      <input 
        type="text" 
        formControlName="lastName"
        placeholder="Ej. Pérez García"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
      <span *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid" class="text-[10px] text-red-400 mt-1 block">
        El apellido es obligatorio (mínimo 2 caracteres).
      </span>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Correo electrónico</label>
      <input 
        type="email" 
        formControlName="email"
        placeholder="ej. usuario@email.com"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
      <span *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-[10px] text-red-400 mt-1 block">
        Ingresa un correo electrónico válido.
      </span>
    </div>

    <!-- Usuario -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Usuario</label>
      <input 
        type="text" 
        formControlName="username"
        placeholder="Ej. admin2"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
      <span *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="text-[10px] text-red-400 mt-1 block">
        El nombre de usuario es obligatorio (mínimo 3 caracteres).
      </span>
    </div>

    <!-- Documento de Identidad (opcional) -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Documento de Identidad <span class="text-slate-500 font-normal">(opcional)</span></label>
      <input 
        type="text" 
        formControlName="identityDocument"
        placeholder="Ej. 12345678"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
    </div>

    <!-- Teléfono (opcional) -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Teléfono <span class="text-slate-500 font-normal">(opcional)</span></label>
      <input 
        type="tel" 
        formControlName="phoneNumber"
        placeholder="Ej. 987654321"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
    </div>

    <!-- Contraseña (opcional, solo reset) -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Nueva Contraseña <span class="text-slate-500 font-normal">(opcional)</span></label>
      <input 
        type="password" 
        formControlName="password"
        placeholder="Dejar vacío para no cambiarla"
        class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
      />
      <span *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-[10px] text-red-400 mt-1 block">
        La contraseña debe tener mínimo 6 caracteres.
      </span>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-800/80">
      <button 
        type="button" 
        (click)="onCloseModal()"
        class="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition cursor-pointer">
        Cancelar
      </button>
      <button 
        type="submit" 
        [disabled]="form.invalid"
        class="px-4 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded-lg transition shadow-md cursor-pointer">
        Guardar
      </button>
    </div>

  </form>

</app-modal>
