<div class="p-1 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- TABLA 1: MARCAS -->
    <app-generic-table 
        #brandTable
        procedure="GET_BRANDS"
        title="MARCAS"
        [columns]="brandColumns"
        [customTemplates]="brandTemplates()"
        [showAddButton]="true"
        (addClicked)="onAddBrand()"
        (rowClick)="onSelectBrand($event)">
    </app-generic-table>

    <!-- TABLA 2: MODELOS -->
    <ng-container *ngIf="selectedBrand(); else noBrandSelected">
        <app-generic-table 
            #modelTable
            procedure="GET_MODELS"
            [title]="'MODELOS DE ' + selectedBrand()?.name"
            [columns]="modelColumns"
            [customTemplates]="modelTemplates()"
            [defaultFilters]="modelFilters()"
            [showAddButton]="true"
            (addClicked)="onAddModel()">
        </app-generic-table>
    </ng-container>

    <ng-template #noBrandSelected>
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-12 text-center text-slate-500 text-xs flex flex-col items-center justify-center min-h-[300px]">
            Selecciona una marca de la tabla izquierda para gestionar sus modelos.
        </div>
    </ng-template>

</div>

<!-- TEMPLATE REUTILIZABLE PARA ACCIONES (EDITAR / ELIMINAR) -->
<ng-template #actionsTemplate let-row>
    <div class="flex items-center justify-center gap-1 min-w-[60px] whitespace-nowrap" (click)="$event.stopPropagation()">
        
        <!-- Botón Editar -->
        <button 
            (click)="onEditItem(row)"
            type="button" 
            class="p-1 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded transition cursor-pointer"
            title="Editar">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
        </button>

        <!-- Botón Eliminar -->
        <button 
            (click)="onDeleteItem(row)"
            type="button" 
            class="p-1 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded transition cursor-pointer"
            title="Eliminar">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
        </button>

    </div>
</ng-template>

<!-- MODAL FORMULARIO CREAR / EDITAR -->
<app-brand-modal
    [isOpen]="isModalOpen()"
    [title]="modalTitle()"
    [item]="editingItem()"
    [selectedBrandName]="selectedBrand()?.name ?? null"
    [brandId]="brandIdForModal()"
    (close)="isModalOpen.set(false)"
    (save)="onSaveItem($event)">
</app-brand-modal>

<!-- MODAL DE CONFIRMACIÓN DE ELIMINACIÓN -->
<app-confirm-modal
    [isOpen]="isDeleteModalOpen()"
    [isLoading]="isDeleting()"
    title="Eliminar Registro"
    [message]="deleteMessage()"
    (confirm)="onConfirmDelete()"
    (cancel)="isDeleteModalOpen.set(false)">
</app-confirm-modal>
