<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
  <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md shadow-2xl overflow-hidden">
    
    <!-- CABECERA -->
    <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
      <h3 class="text-sm font-semibold text-white uppercase tracking-wider">{{ title }}</h3>
      <button 
        (click)="onCloseModal()" 
        type="button" 
        class="text-slate-400 hover:text-white transition p-1 rounded-lg hover:bg-slate-800 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- CUERPO DEL FORMULARIO -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-5 space-y-4">
      
      <!-- Campo Nombre -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Nombre</label>
        <input 
          type="text" 
          formControlName="name"
          (input)="onNameInput()"
          placeholder="Ej. Laptops y Accesorios"
          class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"
        />
        <span *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="text-[10px] text-red-400 mt-1 block">
          El nombre es obligatorio (mínimo 2 caracteres).
        </span>
      </div>

      <!-- Campo Slug -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Slug (URL amigable)</label>
        <input 
          type="text" 
          formControlName="slug"
          (input)="onSlugInput()"
          placeholder="laptops-y-accesorios"
          class="w-full px-3 py-2 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500 font-mono"
        />
        <span *ngIf="form.get('slug')?.touched && form.get('slug')?.invalid" class="text-[10px] text-red-400 mt-1 block">
          El slug es obligatorio.
        </span>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-800/80">
        <button 
          type="button" 
          (click)="onCloseModal()"
          class="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition cursor-pointer">
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="form.invalid"
          class="px-4 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded-lg transition shadow-md cursor-pointer">
          Guardar
        </button>
      </div>

    </form>

  </div>
</div>
