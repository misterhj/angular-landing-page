<div class="p-1 grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- TABLA 1: CATEGORÍAS PRINCIPALES -->
  <div>
    <app-generic-table
      #catTable
      procedure="GET_CATEGORIES"
      title="CATEGORÍAS PRINCIPALES"
      [columns]="catColumns"
      [customTemplates]="catTemplates()" 
      (rowClick)="onSelectCategory($event)"
      (addClicked)="onAddCategory()">
    </app-generic-table>
  </div>

  <!-- TABLA 2: SUBCATEGORÍAS -->
  <div>
    <ng-container *ngIf="selectedCategory(); else selectPrompt">
      <app-generic-table
        #subTable
        procedure="GET_SUBCATEGORIES"
        [title]="'SUBCATEGORÍAS DE ' + selectedCategory()?.name"
        [columns]="subColumns"
        [customTemplates]="subTemplates()"
        [defaultFilters]="subFilters()"
        (addClicked)="onAddSubcategory()">
      </app-generic-table>
    </ng-container>

    <ng-template #selectPrompt>
      <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-12 text-center text-slate-500 text-xs flex flex-col items-center justify-center min-h-[300px]">
        Selecciona una categoría de la tabla izquierda para gestionar sus subcategorías.
      </div>
    </ng-template>
  </div>

</div>

<!-- TEMPLATE REUTILIZABLE PARA ACCIONES (EDITAR / ELIMINAR) -->
<ng-template #actionsTemplate let-row>
  <div class="flex items-center justify-end gap-1" (click)="$event.stopPropagation()">
    <!-- Botón Editar -->
    <button 
      (click)="onEditItem(row)"
      type="button" 
      class="p-1 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded transition cursor-pointer"
      title="Editar">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>
    
    <!-- Botón Eliminar -->
    <button 
      (click)="onDeleteItem(row)"
      type="button" 
      class="p-1 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded transition cursor-pointer"
      title="Eliminar">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>
  </div>
</ng-template>

<!-- MODAL FORMULARIO CREAR / EDITAR -->
<app-category-modal
  [isOpen]="isModalOpen()"
  [title]="modalTitle()"
  [item]="editingItem()"
  [parentCategoryId]="parentCategoryIdForModal()"
  (close)="isModalOpen.set(false)"
  (save)="onSaveItem($event)">
</app-category-modal>

<!-- MODAL CONFIRMACIÓN DE ELIMINACIÓN -->
<app-confirm-modal
  [isOpen]="isDeleteModalOpen()"
  title="Eliminar Registro"
  [message]="deleteMessage()"
  [isLoading]="isDeleting()"
  (cancel)="isDeleteModalOpen.set(false)"
  (confirm)="onConfirmDelete()">
</app-confirm-modal>
