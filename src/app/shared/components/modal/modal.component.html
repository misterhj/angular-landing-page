<div 
  *ngIf="isOpen()" 
  (click)="onBackdropClick($event)"
  class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
  
  <div [class]="'bg-slate-900 border border-slate-800 rounded-xl w-full shadow-2xl overflow-hidden flex flex-col my-auto ' + maxWidthClass()">
    
    <!-- CABECERA (Si se provee un título) -->
    <div *ngIf="title()" class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
      <h3 class="text-sm font-semibold text-white uppercase tracking-wider">{{ title() }}</h3>
      <button 
        (click)="close.emit()" 
        type="button" 
        class="text-slate-400 hover:text-white transition p-1 rounded-lg hover:bg-slate-800 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- CUERPO DINÁMICO (Aquí se inyecta el contenido) -->
    <div class="p-5 flex-1 overflow-y-auto max-h-[80vh]">
      <ng-content></ng-content>
    </div>

  </div>
</div>
